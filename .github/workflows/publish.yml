name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingAbi
          path: Binding.Abi

      # The shim compiles inline template bodies, so it needs the carrier headers and the
      # packages the carrier builds with.
      - name: Carrier
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLamina
          ref: v26.60.2
          path: Third/LeviLamina

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Carrier packages
        working-directory: Third/LeviLamina
        run: xmake f -y -m release

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Hosihikari.Bindings.Bedrock.slnx -c Release -p:AbiProjectPath=${{ github.workspace }}/Binding.Abi/src/Hosihikari.Bindings.Abi/Hosihikari.Bindings.Abi.csproj

      - name: Verify generated sources
        run: python scripts/verify_generated.py

      - name: Build native shim
        run: |
          $env:PATH = "C:/Program Files/LLVM/bin;$env:PATH"
          powershell -NoProfile -ExecutionPolicy Bypass -File native/BindingShim/build.ps1 -Configuration win-x64-server -LeviLaminaRoot Third/LeviLamina -Output artifacts/native/Hosihikari.Bindings.Bedrock.Shim.dll

      - name: Pack
        run: |
          dotnet pack src/Hosihikari.Bindings.Bedrock.Interop/Hosihikari.Bindings.Bedrock.Interop.csproj -c Release -p:AbiProjectPath=${{ github.workspace }}/Binding.Abi/src/Hosihikari.Bindings.Abi/Hosihikari.Bindings.Abi.csproj -o artifacts/pack
          dotnet pack src/Hosihikari.Bindings.Bedrock.Shim/Hosihikari.Bindings.Bedrock.Shim.csproj -c Release -p:ShimDll=${{ github.workspace }}/artifacts/native/Hosihikari.Bindings.Bedrock.Shim.dll -o artifacts/pack

      - name: Push to NuGet
        run: dotnet nuget push artifacts/pack/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
