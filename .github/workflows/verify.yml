name: verify

on:
  push:
    branches: [v1.26.60]
  pull_request:

jobs:
  managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: IR contract
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingIr
          path: Binding.Ir

      - name: Generator
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingGenerator
          path: Binding.Generator

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingAbi
          path: Binding.Abi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Hosihikari.Bindings.Bedrock.slnx -c Release -p:AbiProjectPath=${{ github.workspace }}/Binding.Abi/src/Hosihikari.Bindings.Abi/Hosihikari.Bindings.Abi.csproj

      - name: Verify generated sources
        run: python3 scripts/verify_generated.py

      - name: Validate coverage contract
        run: dotnet run --project Binding.Generator/src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- validate-coverage coverage/summary.json coverage/manifest.jsonl

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The shim compiles inline template bodies, so it needs the carrier headers and the
      # packages the carrier builds with.
      - name: Carrier
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLamina
          ref: v26.60.2
          path: Third/LeviLamina

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Carrier packages
        working-directory: Third/LeviLamina
        run: xmake f -y -m release

      - name: Build Windows shim
        run: |
          $env:PATH = "C:/Program Files/LLVM/bin;$env:PATH"
          powershell -NoProfile -ExecutionPolicy Bypass -File native/BindingShim/build.ps1 -Configuration win-x64-server -LeviLaminaRoot Third/LeviLamina -Output artifacts/native/Hosihikari.Bindings.Bedrock.Shim.dll
