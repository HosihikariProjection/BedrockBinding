name: verify

on:
  push:
    branches: [v1.26.60]
  pull_request:

jobs:
  managed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: IR contract
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingIr
          path: Binding.Ir

      - name: Generator
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingGenerator
          path: Binding.Generator

      - name: ABI contract
        uses: actions/checkout@v4
        with:
          repository: HosihikariProjection/BindingAbi
          path: Binding.Abi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Hosihikari.Bindings.Bedrock.slnx -c Release -p:AbiProjectPath=${{ github.workspace }}/Binding.Abi/src/Hosihikari.Bindings.Abi/Hosihikari.Bindings.Abi.csproj

      - name: Verify generated sources
        run: python3 scripts/verify_generated.py

      - name: Validate coverage contract
        run: dotnet run --project Binding.Generator/src/Hosihikari.Bindings.Generator/Hosihikari.Bindings.Generator.csproj -c Release -- validate-coverage coverage/summary.json coverage/manifest.jsonl

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The shim compiles inline template bodies, so it needs the carrier headers and the
      # packages the carrier builds with.
      - name: Carrier
        uses: actions/checkout@v4
        with:
          repository: LiteLDev/LeviLamina
          ref: v26.60.2
          path: Third/LeviLamina

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Carrier packages
        working-directory: Third/LeviLamina
        run: xmake f -y -m release

      # The shim is compiled with the same clang every other surface pins; the runner's
      # preinstalled LLVM changes without notice and decides by itself whether an implicit
      # destructor is instantiated where a class holding an incomplete type is defined.
      - name: Cache LLVM
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: llvm.tar.xz
          key: llvm-23.1.0-windows-x64

      - name: Download LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          curl.exe -fsSL -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/clang+llvm-23.1.0-x86_64-pc-windows-msvc.tar.xz

      - name: Extract LLVM
        run: |
          New-Item -ItemType Directory -Force llvm | Out-Null
          tar -xf llvm.tar.xz -C llvm --strip-components=1

      - name: Build Windows shim
        run: |
          $env:HOSIHIKARI_CLANG_CL = "${{ github.workspace }}/llvm/bin/clang-cl.exe"
          powershell -NoProfile -ExecutionPolicy Bypass -File native/BindingShim/build.ps1 -Configuration win-x64-server -LeviLaminaRoot Third/LeviLamina -Output artifacts/native/Hosihikari.Bindings.Bedrock.Shim.dll
